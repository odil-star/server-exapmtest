# /etc/nginx/sites-available/demotest  (затем ln -s в sites-enabled)
# Сертификат: sudo certbot --nginx -d example.com -d www.example.com
server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com www.example.com;

    # certbot впишет пути к сертификатам сам
    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    client_max_body_size 10m;   # загрузка .txt/.docx с тестами

    location /static/ {
        alias /srv/demotest/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/demotest/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
