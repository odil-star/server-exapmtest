# /etc/nginx/sites-available/demotest  (затем ln -s в sites-enabled)
# Сертификат получаем ДО включения конфига: certbot certonly --standalone -d vps12172.eskiz.uz
server {
    listen 80;
    server_name vps12172.eskiz.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vps12172.eskiz.uz;

    ssl_certificate     /etc/letsencrypt/live/vps12172.eskiz.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps12172.eskiz.uz/privkey.pem;

    client_max_body_size 10m;   # загрузка .txt/.docx с тестами

    location /static/ {
        alias /srv/demotest/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/demotest/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
