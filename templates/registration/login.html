{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<section class="card shadow-sm mx-auto auth-card">
    <div class="card-body p-4">
    <h1 class="h3 mb-4">Вход</h1>
    <form method="post" class="d-grid gap-3">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}
        <div>
            <label class="form-label" for="{{ form.username.id_for_label }}">Имя пользователя</label>
            <input type="text" name="{{ form.username.name }}" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="{{ form.username.id_for_label }}" class="form-control">
        </div>
        <div>
            <label class="form-label" for="{{ form.password.id_for_label }}">Пароль</label>
            <input type="password" name="{{ form.password.name }}" autocomplete="current-password" required id="{{ form.password.id_for_label }}" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    </div>
</section>
{% endblock %}
